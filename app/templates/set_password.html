{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width: 440px; margin: 1.5rem auto;">
    <h1>Choose your password</h1>
    <p class="muted">Pick a password (at least 8 characters) to sign in from now on.</p>
    {% if error %}<p style="color:#b00000">{{ error }}</p>{% endif %}
    <form method="post" action="/set-password">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="new_password" placeholder="new password" required autofocus>
      <input type="password" name="confirm_password" placeholder="repeat password" required>
      <button type="submit">Set password</button>
    </form>
  </div>
{% endblock %}
