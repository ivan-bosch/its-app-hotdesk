{% extends "admin_base.html" %}
{% block admin_content %}
  <h1>Teams</h1>

  <div class="table-wrap">
  <table>
    <thead>
      <tr><th>Name</th><th>Help Desk team</th><th>Employees</th><th></th></tr>
    </thead>
    <tbody>
      {% for t in teams %}
        <tr>
          <td>{{ t.name }}</td>
          <td>{{ 'Yes' if t.is_helpdesk else '' }}</td>
          <td>{{ counts.get(t.id, 0) }}</td>
          <td>
            <form method="post" action="/admin/teams/{{ t.id }}/delete" onsubmit="return confirm('Delete {{ t.name }}? Its employees will be left without a team.');">
              <button type="submit" class="secondary" style="padding: 0.2rem 0.6rem;">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  </div>

  <h3>Add team</h3>
  <form method="post" action="/admin/teams">
    <div class="grid">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>
        <input type="checkbox" name="is_helpdesk" value="true">
        Help Desk team (gets HD-01/02/03 reserved desks)
      </label>
    </div>
    <button type="submit">Add team</button>
  </form>
{% endblock %}
